name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-peerly-core
  cancel-in-progress: false

env:
  IMAGE_NAME: peerly-core

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain

      - name: Generate protobufs
        run: buf generate

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "::error::REGISTRY secret is not set"
            exit 1
          fi
          IMAGE="$REGISTRY/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      - name: Push image
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          IMAGE="$REGISTRY/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          docker push "$IMAGE"

  build-push-migrations:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build migrations image
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "::error::REGISTRY secret is not set"
            exit 1
          fi
          IMAGE="$REGISTRY/${{ env.IMAGE_NAME }}-migrations:${{ github.sha }}"
          docker build -t "$IMAGE" -f Dockerfile.migrations .

      - name: Scan migrations image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.REGISTRY }}/${{ env.IMAGE_NAME }}-migrations:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      - name: Push migrations image
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          IMAGE="$REGISTRY/${{ env.IMAGE_NAME }}-migrations:${{ github.sha }}"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          docker push "$IMAGE"

  deploy-k3s-stage:
    needs: [build-push, build-push-migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout peerly-manifests
        uses: actions/checkout@v4
        with:
          repository: peerly-team/peerly-manifests
          token: ${{ secrets.MANIFESTS_PAT }}
          path: manifests

      - name: Bump core-stage image tag
        run: |
          cd manifests
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" values/core-stage.yaml
          git config user.email "ci-bot@peerly.local"
          git config user.name "peerly-ci-bot"
          git add values/core-stage.yaml
          if ! git diff --staged --quiet; then
            git pull --rebase
            git commit -m "stage(core): bump image to ${{ github.sha }}"
            git push
          fi

  deploy-k3s-prod:
    needs: [build-push, build-push-migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout peerly-manifests
        uses: actions/checkout@v4
        with:
          repository: peerly-team/peerly-manifests
          token: ${{ secrets.MANIFESTS_PAT }}
          path: manifests

      - name: Bump core-prod image tag
        run: |
          cd manifests
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" values/core-prod.yaml
          git config user.email "ci-bot@peerly.local"
          git config user.name "peerly-ci-bot"
          git add values/core-prod.yaml
          if ! git diff --staged --quiet; then
            git pull --rebase
            git commit -m "prod(core): bump image to ${{ github.sha }}"
            git push
          fi
