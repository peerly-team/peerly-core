name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-peerly-core
  cancel-in-progress: false

env:
  IMAGE_NAME: peerly-core

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain

      - name: Generate protobufs
        run: buf generate

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  migrate-stage:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          install-goose: "true"

      - name: Download DB CA certificate
        run: curl -fsSL "${{ vars.DB_CA_URL }}" -o /tmp/db-ca.crt

      - name: Apply migrations to stage DB
        env:
          PGHOST: ${{ secrets.PG_HOST_STAGE }}
          PGPORT: ${{ vars.PG_PORT }}
          PGDATABASE: ${{ vars.PG_DATABASE }}
          PGUSER: ${{ vars.PG_USER }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD_STAGE }}
        run: |
          CONN="host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER password=$PGPASSWORD sslmode=verify-full sslrootcert=/tmp/db-ca.crt"
          goose -dir src/Peerly.Core.Persistence/Migrations postgres "$CONN" up

  migrate-prod:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          install-goose: "true"

      - name: Download DB CA certificate
        run: curl -fsSL "${{ vars.DB_CA_URL }}" -o /tmp/db-ca.crt

      - name: Apply migrations to prod DB
        env:
          PGHOST: ${{ secrets.PG_HOST }}
          PGPORT: ${{ vars.PG_PORT }}
          PGDATABASE: ${{ vars.PG_DATABASE }}
          PGUSER: ${{ vars.PG_USER }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          CONN="host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER password=$PGPASSWORD sslmode=verify-full sslrootcert=/tmp/db-ca.crt"
          goose -dir src/Peerly.Core.Persistence/Migrations postgres "$CONN" up

  build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "::error::REGISTRY secret is not set"
            exit 1
          fi
          IMAGE="$REGISTRY/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      - name: Push image
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          IMAGE="$REGISTRY/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          docker push "$IMAGE"

  # =========================================================================
  # K3S — bump image tag in peerly-manifests; Argo CD picks up and syncs.
  # =========================================================================
  deploy-k3s-stage:
    needs: [migrate-stage, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout peerly-manifests
        uses: actions/checkout@v4
        with:
          repository: peerly-team/peerly-manifests
          token: ${{ secrets.MANIFESTS_PAT }}
          path: manifests

      - name: Bump core-stage image tag
        run: |
          cd manifests
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" values/core-stage.yaml
          git config user.email "ci-bot@peerly.local"
          git config user.name "peerly-ci-bot"
          git add values/core-stage.yaml
          if ! git diff --staged --quiet; then
            git pull --rebase
            git commit -m "stage(core): bump image to ${{ github.sha }}"
            git push
          fi

  deploy-k3s-prod:
    needs: [migrate-prod, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout peerly-manifests
        uses: actions/checkout@v4
        with:
          repository: peerly-team/peerly-manifests
          token: ${{ secrets.MANIFESTS_PAT }}
          path: manifests

      - name: Bump core-prod image tag
        run: |
          cd manifests
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" values/core-prod.yaml
          git config user.email "ci-bot@peerly.local"
          git config user.name "peerly-ci-bot"
          git add values/core-prod.yaml
          if ! git diff --staged --quiet; then
            git pull --rebase
            git commit -m "prod(core): bump image to ${{ github.sha }}"
            git push
          fi
